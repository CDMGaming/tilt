# Every push to main: run the tests, build, deploy the relay and the app to Cloudflare.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno install
      - run: deno test --sloppy-imports --no-check tests/
      - run: deno run -A npm:vite build
      - name: Tidy the secrets (a pasted space or line break breaks wrangler)
        if: env.RAW_TOKEN != ''
        run: |
          # The ID is 32 hex characters; take it out of a longer paste (a dashboard URL, a label).
          account=$(printf %s "$RAW_ACCOUNT" | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{32}' | head -1 || true)
          if [ -z "$account" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID has no 32-character account ID in it"; exit 1; fi
          # Just the token, even from a pasted `-H "Authorization: Bearer <token>"` line.
          token=$(printf %s "$RAW_TOKEN" | sed -E 's/.*Bearer[[:space:]]+//' | tr -d '[:space:]"'"'"'')
          echo "::add-mask::$account"
          echo "::add-mask::$token"
          echo "account id: found ($(printf %s "$RAW_ACCOUNT" | grep -oE '[0-9a-fA-F]{32}' | wc -l) candidate(s) in the secret)"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        if: env.RAW_TOKEN != ''
        with:
          node-version: 22
      - name: Relay
        if: env.RAW_TOKEN != ''
        run: npx --yes wrangler@4 deploy --config cloud/wrangler.toml
      - name: Pages project (made on the first run)
        if: env.RAW_TOKEN != ''
        run: npx --yes wrangler@4 pages project list | grep -q "tilt-jam " || npx --yes wrangler@4 pages project create tilt-jam --production-branch=main
      - name: Song sharing storage (KV tilt-shares, R2 tilt-samples), when they exist
        if: env.RAW_TOKEN != ''
        run: |
          # Names only are printed (no ids, no secrets), so a typo or a missing permission is easy to spot.
          # wrangler may print its banner first: keep from the JSON's opening bracket on.
          kvjson=$(npx --yes wrangler@4 kv namespace list 2>kv.err | sed -n '/^\[/,$p') || true
          [ -n "$kvjson" ] || { echo "Listing KV gave nothing:"; grep -iE "error|permission|auth" kv.err | head -5; }
          echo "KV namespaces this token can see: $(echo "$kvjson" | jq -r '[.[].title] | join(", ")' 2>/dev/null)"
          kv=$(echo "$kvjson" | jq -r '.[] | select(.title=="tilt-shares") | .id' 2>/dev/null || true)
          if [ -n "$kv" ]; then
            { echo; echo '[[kv_namespaces]]'; echo 'binding = "SHARES"'; echo "id = \"$kv\""; } >> wrangler.toml
            echo "KV namespace tilt-shares: bound as SHARES"
          else
            echo "::warning::No KV namespace named tilt-shares: Share song falls back to self-contained #song= links"
          fi
          # Ask for the bucket by name (also finds it in another jurisdiction such as EU).
          if npx --yes wrangler@4 r2 bucket info tilt-samples >r2.out 2>r2.err || npx --yes wrangler@4 r2 bucket info tilt-samples --jurisdiction eu >r2.out 2>r2.err; then
            { echo; echo '[[r2_buckets]]'; echo 'binding = "SAMPLES"'; echo 'bucket_name = "tilt-samples"'; grep -qi "jurisdiction.*eu" r2.out && echo 'jurisdiction = "eu"'; } >> wrangler.toml
            echo "R2 bucket tilt-samples: bound as SAMPLES"
          else
            echo "R2 says: $(grep -iE 'error|not exist|enable|code' r2.err | head -3 | paste -sd' ' -)"
            echo "R2 buckets this token can see: $(npx --yes wrangler@4 r2 bucket list 2>/dev/null | sed -n 's/^name:[[:space:]]*//p' | paste -sd, -)"
            echo "::warning::No R2 bucket named tilt-samples: shared songs go out without user samples"
          fi
      - name: App
        if: env.RAW_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name=tilt-jam --branch=main
